# airlock.conf — Central configuration for Airlock sandbox
# Sourced by all airlock-*.sh scripts
# No secrets in this file — credentials referenced by path only

# ── Images ─────────────────────────────────────────────────────────────
# No hardcoded image — image name is passed to airlock-build.sh and airlock-launch.sh
# Per-image hashes stored in this directory as <image-name>.hash
AIRLOCK_IMAGE_HASH_DIR="$HOME/.airlock/hashes"

# ── Paths ──────────────────────────────────────────────────────────────
# AIRLOCK_BASE_DIR auto-detects from conf file location; override with env var
AIRLOCK_BASE_DIR="${AIRLOCK_BASE_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"
AIRLOCK_STATE_DIR="$HOME/.airlock"
AIRLOCK_SESSION_DIR="$HOME/.airlock/sessions"
AIRLOCK_ALLOWLISTS_DIR="$HOME/.airlock/allowlists"

# ── Resource Limits ────────────────────────────────────────────────────
AIRLOCK_MEMORY="4g"
AIRLOCK_PIDS_LIMIT="256"
AIRLOCK_CPUS="2"
AIRLOCK_NOFILE="1024"
AIRLOCK_TMPFS_TMP_SIZE="2g"
AIRLOCK_TMPFS_HOME_SIZE="1g"

# ── Timeouts ───────────────────────────────────────────────────────────
AIRLOCK_SESSION_TIMEOUT="14400"       # 4 hours in seconds
AIRLOCK_CHECKPOINT_INTERVAL="300"     # 5 minutes in seconds
AIRLOCK_KEY_LOAD_TIMEOUT="10"         # seconds to wait for readiness signal

# ── Network ────────────────────────────────────────────────────────────
AIRLOCK_DNS_SERVERS="1.1.1.1 8.8.8.8 9.9.9.9"
AIRLOCK_API_DOMAINS="api.anthropic.com platform.claude.com"
AIRLOCK_API_PORT="443"

# ── Security ───────────────────────────────────────────────────────────
AIRLOCK_SIGNING_KEY="${AIRLOCK_SIGNING_KEY:-$HOME/.ssh/id_ed25519}"
AIRLOCK_ALLOWED_SIGNERS="$HOME/.airlock/allowed_signers"
AIRLOCK_SECCOMP_PROFILE="${AIRLOCK_SECCOMP_PROFILE:-$AIRLOCK_BASE_DIR/seccomp-profile.json}"

# ── Credentials (path only — never embed values) ──────────────────────
# Option A: OAuth credentials file (Claude Max subscription)
AIRLOCK_CREDENTIALS_HOST="${AIRLOCK_CREDENTIALS_HOST:-$HOME/.claude/.credentials.json}"
# Mount to /run/credentials (outside tmpfs at /home/claude) — entrypoint symlinks into place
AIRLOCK_CREDENTIALS_MOUNT="/run/credentials/.credentials.json"
AIRLOCK_CREDENTIALS_CONTAINER="/home/claude/.claude/.credentials.json"

# Option B: API key (set env var — never put the key in this file)
# export ANTHROPIC_API_KEY="sk-ant-..." before running airlock-launch.sh
# When set, credentials file is not required.
AIRLOCK_API_KEY="${ANTHROPIC_API_KEY:-}"

# ── Sessions ───────────────────────────────────────────────────────────
AIRLOCK_MAX_CONCURRENT="2"
AIRLOCK_LOG_RETENTION_DAYS="30"
AIRLOCK_CONTAINER_PREFIX="airlock"

# ── Anomaly Detection ─────────────────────────────────────────────────
# Strikes accumulate across checks. Auto-kill at AIRLOCK_MAX_STRIKES.
# A clean check decays one strike (self-healing for transient spikes).
AIRLOCK_MAX_STRIKES="5"

# Memory: flag if container exceeds this % of its limit
AIRLOCK_ANOMALY_MEM_PCT="90"

# PIDs: flag if container exceeds this % of its limit
AIRLOCK_ANOMALY_PID_PCT="80"

# Blocked connections: flag if more than this many blocked outbound attempts per check
AIRLOCK_ANOMALY_BLOCKED_CONNS="20"

# File creation: flag if more than this many new files appear per check interval
AIRLOCK_ANOMALY_FILE_BURST="200"

# Firewall log prefix (used in iptables LOG rule and dmesg parsing)
AIRLOCK_FW_LOG_PREFIX="AIRLOCK-BLOCKED:"

# ── AI Command ────────────────────────────────────────────────────────
# Command the entrypoint execs inside the container.
# Default is Claude Code. Override for other AI coding tools.
# The binary must be installed in the image and on PATH.
AIRLOCK_AI_COMMAND="${AIRLOCK_AI_COMMAND:-claude --dangerously-skip-permissions}"

# ── Optional ───────────────────────────────────────────────────────────
# TEST_PORT=""   # Uncomment and set to forward a port (e.g., "8080") on localhost
